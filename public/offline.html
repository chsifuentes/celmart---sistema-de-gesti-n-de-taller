<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c0e" />
    <title>CelMart · Sin conexión</title>
    <link rel="icon" href="/icons/celmart.svg" type="image/svg+xml" />
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0c0c0e;color:#f4f4f5;font:16px system-ui,sans-serif;padding:24px}main{width:100%;max-width:420px;border:1px solid #3f3f46;border-radius:24px;background:#17171b;padding:32px}img{width:64px;height:64px}h1{font-size:24px;margin:24px 0 12px}p{color:#a1a1aa;line-height:1.6}button{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:12px;background:#2dd4bf;color:#042f2e;font:700 16px system-ui;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/celmart.svg" alt="CelMart" />
      <h1>Reconecta para continuar</h1>
      <p>CelMart necesita conexión para consultar el estado actualizado de las reparaciones y guardar cambios.</p>
      <p>Revisa tu conexión Wi-Fi o tus datos móviles y vuelve a intentar.</p>
      <button type="button" onclick="window.location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
