name: celmart-whatsapp
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - ./sesion_whatsapp/instances:/evolution/instances
    environment:
      SERVER_PORT: '8080'
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?Ejecuta iniciar para generar .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: celmart
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CORS_METHODS: GET,POST,PUT,DELETE,OPTIONS,HEAD
      CORS_CREDENTIALS: 'false'
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN
      DEL_INSTANCE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:15.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    volumes:
      - ./sesion_whatsapp/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U evolution -d evolution']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - ./sesion_whatsapp/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
